# Local stack: Postgres + Redis + API + worker + web, fully offline (fake model provider, dev login).
#   docker compose up --build    →  http://localhost:3000
# To use real Azure AI Foundry models locally: set MODEL_PROVIDER=foundry and
# FOUNDRY_PROJECT_ENDPOINT in .env, and `az login` on the host (credentials are mounted).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: ecosys, POSTGRES_PASSWORD: ecosys, POSTGRES_DB: ecosys }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "ecosys"], interval: 3s, retries: 20 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment: &api_env
      DATABASE_URL: postgresql+asyncpg://ecosys:ecosys@postgres:5432/ecosys
      REDIS_URL: redis://redis:6379/0
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      AUTH_MODE: dev
      BOOTSTRAP_ADMINS: admin@ecosys.dev
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: { context: ., dockerfile: services/api/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      <<: *api_env
      ROLE: worker
    depends_on: [api]
  web:
    build: { context: apps/web }
    environment:
      API_URL: http://api:8000
      AUTH_SECRET: local-dev-auth-secret-change-me-0123456789
      AUTH_TRUST_HOST: "true"
      AUTH_DEV_LOGIN: "true"
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
