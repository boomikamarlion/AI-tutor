[project]
name = "ecosys-api"
version = "0.1.0"
description = "API and run worker for the AI learning platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.11",
  "pydantic-settings>=2.16",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.32",
  "alembic>=1.20",
  "pyjwt[crypto]>=2.15",
  "httpx>=0.28",
  "redis>=5.2,<6",
  "arq>=0.28",
  "sse-starlette>=3.5",
  "pyyaml>=6.0",
  "azure-identity>=1.26",
  "agent-framework-foundry>=1.15",
  "azure-monitor-opentelemetry>=1.6",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
