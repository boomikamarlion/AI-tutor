name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ecosys, POSTGRES_PASSWORD: ecosys, POSTGRES_DB: ecosys_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ecosys" --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests alembic
      - name: Content validates
        run: uv run python -c "from app.content.loader import load_content; from app.config import get_settings; load_content(get_settings().content_dir)"
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env: { AUTH_SECRET: ci-only, AUTH_DEV_LOGIN: "true" }

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null
