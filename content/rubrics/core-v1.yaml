# Core rubric used by every lab. Human-authored; never generated by a model.
# Labs may add extra criteria (see lab.rubric.extra_criteria) but cannot remove these.
# Each criterion is scored 0-4 by the critic, which must quote evidence first.
id: core
version: 1
title: Core prompt-craft rubric
criteria:
  - id: task_fit
    name: Task fit
    weight: 3
    description: Does the output do what the brief actually asks, for the right audience?
    diagnoses_prompt: Did the prompt state the task, deliverable and audience clearly?
    anchors:
      0: Output does a different task or ignores the brief.
      1: Addresses the topic but misses the main deliverable.
      2: Delivers the main ask but misses an important part of the brief.
      3: Delivers the brief with minor gaps.
      4: Fully delivers the brief for the stated audience.
  - id: structure
    name: Structure & format
    weight: 2
    description: Is the output organised in the requested shape and easy to use?
    diagnoses_prompt: Did the prompt specify sections, format, ordering or a schema?
    anchors:
      0: No usable structure, or wrong format entirely.
      1: Some structure but not what the brief needs.
      2: Mostly the right shape, with inconsistencies.
      3: Right shape with small deviations.
      4: Exactly the requested format, consistent across all test cases.
  - id: constraints
    name: Constraints honoured
    weight: 2
    description: Are length, tone, scope and must/must-not rules from the brief honoured?
    diagnoses_prompt: Were the brief's limits stated explicitly and checkably in the prompt?
    anchors:
      0: Most constraints violated.
      1: Several constraints violated.
      2: One important constraint violated.
      3: Minor slips on a constraint.
      4: Every constraint honoured on every test case.
  - id: groundedness
    name: Grounded, no unsupported claims
    weight: 2
    description: Does the output avoid inventing facts, figures, names or promises not supported by the input?
    diagnoses_prompt: Did the prompt supply facts, restrict sources, and allow "not stated"?
    anchors:
      0: Several invented facts presented as true.
      1: At least one significant invented claim.
      2: Minor unsupported details.
      3: Grounded, with one vague or hedged claim.
      4: Every claim traceable to the input or clearly marked as an assumption.
  - id: consistency
    name: Consistency across test cases
    weight: 1
    description: Does the prompt produce similar quality on every pinned test case, including the hard one?
    diagnoses_prompt: Does the prompt handle variation and edge cases, or only the easy input?
    anchors:
      0: Works on at most one test case.
      1: Works on the easy case only.
      2: Uneven quality across cases.
      3: Good on all but one edge case.
      4: Uniformly strong on every case.
  - id: efficiency
    name: Efficiency
    weight: 1
    description: Is the prompt as short as it can be while still getting the result — no padding, repetition or contradictions?
    diagnoses_prompt: Is anything in the prompt redundant, contradictory or irrelevant?
    anchors:
      0: Long, contradictory or mostly irrelevant.
      1: Much padding or repeated instructions.
      2: Some redundancy.
      3: Tight with a little excess.
      4: Every line earns its place.
